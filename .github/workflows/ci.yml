# TripSage CI — install, typecheck, lint, build, Docker build, security audit.
#
# Runs on push to main and on pull requests targeting main.
# Backend has no ESLint config or test runner yet (tracked in Phase 4/7), so the
# backend job currently runs prisma generate + tsc --noEmit (type safety) + the
# build. When an ESLint config and jest are added to the backend, extend this job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: TypeScript typecheck + Prisma validation + build ────────────────
  backend:
    name: Backend (typecheck · prisma · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (tsc)
        run: npm run build

  # ── Transport (NestJS): lint + build + unit tests ────────────────────────────
  transport:
    name: Transport (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/transport
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/transport/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ── Frontend (Next.js): lint + typecheck + build ─────────────────────────────
  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        run: npm run build

  # ── Docker: validate compose + build all images (no push) ────────────────────
  docker-build:
    name: Docker (compose · build images)
    runs-on: ubuntu-latest
    needs: [backend, transport, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Build transport image
        run: docker compose build transport

      - name: Build frontend image
        run: docker compose build frontend

  # ── Security: dependency audit across workspaces ─────────────────────────────
  security-audit:
    name: Security audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev || true

      - name: Audit transport dependencies
        working-directory: backend/transport
        run: npm audit --audit-level=high --omit=dev || true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev || true
